name: Publish GHCR images

# Builds and pushes the fork's deployment images to GitHub Container Registry.
# One-time: after the first successful run, set both packages to public
# (GitHub → Packages → package → Settings → Change visibility → Public), or add
# registry credentials in Dokploy if you keep them private.

on:
  push:
    branches:
      - feat/cloud-workspace
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  web:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Login to GHCR
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push web image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_APP_CLOUD_ENABLED=true
            VITE_APP_WS_SERVER_URL=${{ steps.wsurl.outputs.url }}
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/excalidraw-web:latest
            ghcr.io/${{ needs.meta.outputs.owner }}/excalidraw-web:sha-${{ needs.meta.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  server:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Login to GHCR
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push server image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/excalidraw-server:latest
            ghcr.io/${{ needs.meta.outputs.owner }}/excalidraw-server:sha-${{ needs.meta.outputs.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
