#:schema https://supabase.com/schemas/config/v1.json
project_id = "excalidraw-cloud"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# project was created with "grant API access to new tables" disabled
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# local email testing server (replaces the old [inbucket] section)
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "4MiB"

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = [
  "http://localhost:3001",
  "http://127.0.0.1:3001",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
